name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 from Oct 2026
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Enables the Postgres half of the backend-parametrised suite.
      AUDITOR_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test (SQLite + Postgres)
        run: pytest

      - name: Committed fixtures match a fresh build
        run: |
          python -m tests.mock_data.build
          git diff --exit-code -- tests/mock_data/generated \
            || (echo "::error::Generated mock data is stale. Run 'python -m tests.mock_data.build' and commit." && exit 1)

  compose-smoke:
    # The README promises `docker compose up` works. This job proves it on every push.
    needs: quality
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 from Oct 2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with random secrets
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^AUDITOR_DB_RO_PASSWORD=.*/AUDITOR_DB_RO_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^AUDITOR_STATE_DB_PASSWORD=.*/AUDITOR_STATE_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^AUDITOR_PAYMENTS_DB_PASSWORD=.*/AUDITOR_PAYMENTS_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          {
            echo "CLERK_KEY=$(openssl rand -hex 24)"; echo "APPROVER_KEY=$(openssl rand -hex 24)"
            echo "AUDITOR_KEY=$(openssl rand -hex 24)"
          } > keys.env
          source keys.env
          sed -i "s/^AUDITOR_API_KEYS=.*/AUDITOR_API_KEYS=clerk.bea:clerk:$CLERK_KEY,ap.manager:approver:$APPROVER_KEY,ian:auditor:$AUDITOR_KEY/" .env
          cat keys.env >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Readiness
        run: curl -fsS http://127.0.0.1:8000/readyz

      - name: Unauthenticated requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/audits \
                 -H 'content-type: application/json' -d @tests/mock_data/generated/requests/S01_clean_services.json)
          [ "$code" = "401" ]

      - name: Golden scenarios over HTTP
        run: |
          for f in tests/mock_data/generated/requests/*.json; do
            id=$(basename "$f" .json)
            want=$(jq -r --arg id "$id" '.scenarios[] | select(.scenario_id==$id) | .expected_verdict' \
                   tests/mock_data/generated/expected_outcomes.json)
            got=$(curl -fsS -X POST http://127.0.0.1:8000/v1/audits -H "Authorization: Bearer $CLERK_KEY" \
                   -H 'content-type: application/json' -d @"$f" | jq -r .verdict)
            echo "$id: want=$want got=$got"
            [ "$want" = "$got" ]
          done

      - name: Agent workflow over HTTP (no LLM key -> manual entry -> HITL -> paid -> written back)
        run: |
          G=tests/mock_data/generated
          API=http://127.0.0.1:8000
          C=(-H "Authorization: Bearer $CLERK_KEY"); A=(-H "Authorization: Bearer $APPROVER_KEY")
          J=(-H 'content-type: application/json')

          run=$(curl -fsS "${C[@]}" -F "file=@$G/invoices/S01_clean_services.pdf;type=application/pdf" $API/v1/runs)
          echo "$run" | jq .
          [ "$(echo "$run" | jq -r .status)" = "NEEDS_MANUAL_ENTRY" ]
          id=$(echo "$run" | jq -r .run_id)

          jq '{invoice: .}' "$G/requests/S01_clean_services.json" > entry.json
          [ "$(curl -fsS "${C[@]}" "${J[@]}" -X POST $API/v1/runs/$id/extraction -d @entry.json \
                | jq -r .status)" = "AWAITING_APPROVAL" ]

          # Approval must survive an API restart (Postgres checkpointer).
          docker compose restart api && docker compose up -d --wait api
          [ "$(curl -fsS "${C[@]}" $API/v1/runs/$id | jq -r .status)" = "AWAITING_APPROVAL" ]

          # A clerk cannot approve (role), and identity cannot be supplied in the body.
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${C[@]}" "${J[@]}" -X POST $API/v1/runs/$id/decision \
                -d '{"approved": true}')" = "403" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${A[@]}" "${J[@]}" -X POST $API/v1/runs/$id/decision \
                -d '{"approved": true, "approver": "someone.else"}')" = "422" ]

          paid=$(curl -fsS "${A[@]}" "${J[@]}" -X POST $API/v1/runs/$id/decision -d '{"approved": true}')
          [ "$(echo "$paid" | jq -r .status)" = "PAID" ]
          [ "$(echo "$paid" | jq -r .decision.approver)" = "ap.manager" ]

          # Written back: the same invoice in a NEW run is now a duplicate.
          again=$(curl -fsS "${C[@]}" -F "file=@$G/invoices/S01_clean_services.pdf;type=application/pdf" $API/v1/runs)
          id2=$(echo "$again" | jq -r .run_id)
          [ "$(curl -fsS "${C[@]}" "${J[@]}" -X POST $API/v1/runs/$id2/extraction -d @entry.json \
                | jq -r '.findings[].code')" = "DUPLICATE_INVOICE" ]

      - name: Audit log is complete, chained, and append-only
        run: |
          API=http://127.0.0.1:8000
          curl -fsS -H "Authorization: Bearer $AUDITOR_KEY" "$API/v1/audit-log" | jq -c '.[] | [.seq, .actor, .action, .outcome.status]'
          [ "$(curl -fsS -H "Authorization: Bearer $AUDITOR_KEY" $API/v1/audit-log/verify | jq -r .valid)" = "true" ]
          source .env
          for stmt in "UPDATE audit.audit_log SET actor = 'x'" "DELETE FROM audit.audit_log"; do
            if docker compose exec -T -e PGPASSWORD="$AUDITOR_STATE_DB_PASSWORD" postgres \
                 psql -h 127.0.0.1 -U auditor_state -d erp -c "$stmt"; then
              echo "::error::auditor_state could run: $stmt"; exit 1
            fi
          done

      - name: Payments role can record payments but not erase them
        run: |
          source .env
          if docker compose exec -T -e PGPASSWORD="$AUDITOR_PAYMENTS_DB_PASSWORD" postgres \
               psql -h 127.0.0.1 -U auditor_payments -d erp -c "DELETE FROM historical_payments"; then
            echo "::error::auditor_payments could delete payments"; exit 1
          fi

      - name: App role cannot write
        run: |
          source .env
          if docker compose exec -T -e PGPASSWORD="$AUDITOR_DB_RO_PASSWORD" postgres \
               psql -h 127.0.0.1 -U auditor_ro -d erp -c "BEGIN READ WRITE; DELETE FROM historical_payments;"; then
            echo "::error::auditor_ro was able to write"; exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
